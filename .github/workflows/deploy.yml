name: Refresh news and deploy Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "1,31 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check briefing selection
        run: python -m unittest discover -s tests -v
      - name: Check reader interactions
        run: node --test tests/client.test.cjs
      - name: Gather current news
        run: python scripts/update_news.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
